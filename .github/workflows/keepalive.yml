name: Supabase keep-alive

# Houdt het Supabase-project van QUIZT.ET wakker. Gratis projecten worden
# gepauzeerd na 7 dagen zonder API-calls; deze workflow pingt om de 3 dagen.
#
# De gebruikte sleutel is de PUBLIEKE anon-key - die staat al in config.js
# en is bedoeld om publiek te zijn. RLS beschermt de data, niet de sleutel.

on:
  schedule:
    - cron: "41 7 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://lfhuuwdwyddzfisfgdor.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmaHV1d2R3eWRkemZpc2ZnZG9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MjI0NDcsImV4cCI6MjA5OTA5ODQ0N30.SKJ4kbd8Tb6k3ZOPUnSJgIM7QCZ48RQezSZJg0DT_YE
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/game_scores?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}") || code="000"
          echo "HTTP ${code}"
          echo "Response: $(cat /tmp/body.txt 2>/dev/null)"
          case "$code" in
            200|401|403) echo "Project is wakker." ;;
            000) echo "Host niet bereikbaar - project is waarschijnlijk gepauzeerd. Hervat het in het Supabase-dashboard."; exit 1 ;;
            *) echo "Onverwachte status ${code}."; exit 1 ;;
          esac
